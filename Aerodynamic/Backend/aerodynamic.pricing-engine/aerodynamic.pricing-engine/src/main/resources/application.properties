spring.application.name=aerodynamic.pricing-engine 
# Configuración de la conexión a PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pricing_engine}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Configuración de JPA / Hibernate
# 'update' creará o actualizará las tablas automáticamente según tus entidades de Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:cambia-esto-por-un-secreto-de-al-menos-32-caracteres}
jwt.expiration-ms=1800000
cors.allowed-origins=http://localhost:8443,https://code-factory-2026-2-ebp-01.vercel.app
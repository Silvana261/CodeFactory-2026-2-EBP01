spring.application.name=aerodynamic.pricing-engine 
# Configuración de la conexión a PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pricing_engine}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.web.error.include-binding-errors=always

# Configuración de JPA / Hibernate
# 'update' creará o actualizará las tablas automáticamente según tus entidades de Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:cambia-esto-por-un-secreto-de-al-menos-32-caracteres}
jwt.expiration-ms=1800000
cors.allowed-origins=http://localhost:8443,https://code-factory-2026-2-ebp-01.vercel.app

# Correo para recuperación de contraseña (Gmail)
# El usuario y la contraseña de aplicación se leen de variables de entorno: NO escribirlos aquí
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# SOLO desarrollo: imprime el código de recuperación en la consola
app.recovery.log-code=${RECOVERY_LOG_CODE:false}
